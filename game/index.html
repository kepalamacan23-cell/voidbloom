<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VOIDBLOOM — Arena Survival</title>
<style>
  html, body { margin: 0; height: 100%; background: #05030f; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  #game {
    display: block;
    width: min(100vw, 177.78vh);
    height: auto;
    aspect-ratio: 16 / 9;
    cursor: crosshair;
    touch-action: none;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="VOIDBLOOM arena survival: move with WASD, aim with the mouse, hold to fire, dash with Shift, nova with E"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
